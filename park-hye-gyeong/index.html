<style>
:root{ --bg1:#F6EDEE; --bg2:#F3E7EC; --ink:#201A16; --ink-soft:#6B5F54; --ink-faint:#9C8F82; --primary:#A8365A; --primary-strong:#7A2240; --primary-soft:#F4DCE4; --accent:#E07A3A; --accent-soft:#FBE1D2; --surface:#FFFFFF; --border:#EFE1E3; --chip-bg:#F6ECEC; --chip-ink:#5A4C3D; --shadow:0 24px 55px -28px rgba(168,54,90,.3); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg1:#17100F; --bg2:#160E12; --ink:#F4EEE6; --ink-soft:#C7B9A8; --ink-faint:#8F8275; --primary:#E58AA6; --primary-strong:#F2B1C4; --primary-soft:#3A1823; --accent:#F0A06A; --accent-soft:#38200F; --surface:#1E1617; --border:#3A2A2E; --chip-bg:#271C1E; --chip-ink:#D8CBB9; --shadow:0 24px 55px -28px rgba(0,0,0,.6); } }
:root[data-theme="dark"]{ --bg1:#17100F; --bg2:#160E12; --ink:#F4EEE6; --ink-soft:#C7B9A8; --ink-faint:#8F8275; --primary:#E58AA6; --primary-strong:#F2B1C4; --primary-soft:#3A1823; --accent:#F0A06A; --accent-soft:#38200F; --surface:#1E1617; --border:#3A2A2E; --chip-bg:#271C1E; --chip-ink:#D8CBB9; --shadow:0 24px 55px -28px rgba(0,0,0,.6); }
*{box-sizing:border-box;}
body{margin:0; min-height:100vh; background:radial-gradient(900px 500px at 15% -10%, color-mix(in srgb, var(--primary) 16%, transparent), transparent 60%), radial-gradient(800px 460px at 100% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 55%), linear-gradient(180deg, var(--bg1), var(--bg2)); color:var(--ink); font-family:'Apple SD Gothic Neo','Malgun Gothic','Pretendard','Noto Sans KR',sans-serif; display:flex; justify-content:center; padding:40px 16px 70px;}
.frame{width:100%; max-width:400px;}
.card{background:var(--surface); border-radius:28px; overflow:hidden; box-shadow:var(--shadow); border:1px solid var(--border);}
.photo-wrap{position:relative; width:100%; aspect-ratio:900/655; overflow:hidden; background:var(--primary-soft);}
.photo-wrap img{width:100%; height:100%; object-fit:cover; object-position:50% 50%; display:block;}
.photo-wrap .ph{width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:5rem; font-weight:800; color:var(--primary-strong); background:linear-gradient(135deg, var(--primary-soft), var(--accent-soft));}
.photo-wrap::after{content:''; position:absolute; inset:auto 0 0 0; height:46%; background:linear-gradient(180deg, transparent, color-mix(in srgb, var(--surface) 92%, transparent) 88%, var(--surface));}
.id-panel{padding:4px 24px 18px; position:relative; margin-top:-34px;}
.id-row{display:flex; align-items:flex-end; justify-content:space-between; gap:10px;}
.id-row h1{margin:0; font-size:1.5rem; font-weight:800; letter-spacing:-.01em;}
.brand{font-size:.78rem; font-weight:800; color:var(--primary-strong); letter-spacing:.06em; text-transform:uppercase; text-align:right; line-height:1.3;}
.brand small{display:block; font-size:.62rem; font-weight:700; color:var(--ink-faint); letter-spacing:.04em; margin-top:1px;}
.role-line{margin:5px 0 0; font-size:.9rem; color:var(--ink-soft); font-weight:600; line-height:1.5;}
.chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:13px;}
.chip{background:color-mix(in srgb, var(--accent) 10%, transparent); color:var(--ink); font-size:.7rem; font-weight:700; padding:5px 11px; border-radius:999px; border:1.4px solid var(--accent);}
.divider{height:8px; background:var(--bg1);}
.list{padding:4px 6px;}
.list a.row, .list div.row{display:flex; align-items:center; gap:14px; padding:15px 16px; text-decoration:none; color:inherit; border-bottom:1px solid var(--border);}
.list a.row:last-child, .list div.row:last-child{border-bottom:none;}
.row .ico{width:38px; height:38px; border-radius:12px; flex:none; display:flex; align-items:center; justify-content:center; font-size:1.1rem; background:var(--primary-soft); color:var(--primary-strong);}
.row .ico.accent{background:var(--accent-soft); color:var(--accent);}
.row .ico.ico-lux{width:58px; height:58px; border-radius:18px; overflow:hidden; box-shadow:0 6px 14px -7px rgba(0,0,0,.45); padding:0;}
.row .ico.ico-lux img{width:100%; height:100%; object-fit:cover; display:block;}
.row .ico.ico-emoji{font-size:1.7rem;}
.row .tx{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
.row .tx .lbl{font-size:.74rem; color:var(--ink-faint); font-weight:700;}
.row .tx .val{font-size:.95rem; color:var(--ink); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.row .chev{color:var(--ink-faint); font-size:1.1rem; flex:none;}
.section-title{font-size:.72rem; font-weight:800; color:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase; padding:16px 22px 4px;}
.link-row .thumb{width:44px; height:44px; border-radius:12px; flex:none; overflow:hidden; background:var(--chip-bg);}
.link-row .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.qr-block{display:flex; flex-direction:column; align-items:center; gap:10px; margin:14px 16px 18px; padding:20px; border-radius:18px; background:var(--chip-bg); border:1px solid var(--border);}
.qr-block .qr-wrap{background:#fff; padding:10px; border-radius:12px; line-height:0; box-shadow:0 8px 20px -12px rgba(0,0,0,.25);}
.qr-block .qr-wrap img{display:block; width:140px; height:140px;}
.qr-block p{margin:0; font-size:.86rem; font-weight:700; color:var(--ink-soft); text-align:center;}
.link-copy{width:100%; display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:4px;}
.link-url{font-size:.72rem; color:var(--ink-faint); word-break:break-all; text-align:center; padding:0 4px;}
.link-actions{display:flex; gap:8px; width:100%;}
.link-btn{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:11px 8px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:.8rem; font-weight:700; font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;}
.link-btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.link-btn:active{transform:scale(0.97);}
footer{text-align:center; color:var(--ink-faint); font-size:.78rem; padding:18px 0 4px;}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
.photo-wrap{aspect-ratio:1200/620;}
.photo-wrap::after{height:10%;}
.id-panel{margin-top:-2px;}
</style>
